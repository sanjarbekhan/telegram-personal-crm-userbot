services:
  - type: worker
    name: telegram-personal-crm-userbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE_NUMBER
        sync: false
      - key: TELETHON_SESSION
        sync: false
      - key: ADMIN_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DAILY_SEND_LIMIT
        value: 100
      - key: MIN_DELAY_SECONDS
        value: 20
      - key: MAX_DELAY_SECONDS
        value: 40
      - key: SCAN_DAYS
        value: 30
      - key: RUN_INITIAL_SCAN
        value: false
      - key: POLL_SECONDS
        value: 8
